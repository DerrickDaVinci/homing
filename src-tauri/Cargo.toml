[package]
name = "homing"
version = "0.1.0"
description = "Move AI-agent project folders off your Desktop without losing their chat history."
authors = ["Homing contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "homing"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
memchr = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSArray", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard", "NSEvent"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
