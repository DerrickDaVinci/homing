<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Homing app icon.
    Lane: soft 3D object-character. Metaphor: a project folder hugging its own
    chat bubble on the way home (object + action + emotion = project folder +
    carries its conversations to their new place + relieved, cheerful).
    Hook: purposeful prop (the chat bubble). Palette: coral_friendly
    (#F95E2B dominant, #FDDA34 contrast, #F8F6F5 neutral, #121212 ink).
    Light from the upper left. macOS grid: 824 px body on a 1024 canvas.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A55"/>
      <stop offset="1" stop-color="#F2501F"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.38" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBB13A"/>
      <stop offset="1" stop-color="#E58A17"/>
    </linearGradient>
    <linearGradient id="front" x1="0.2" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFEA7A"/>
      <stop offset="0.55" stop-color="#FDDA34"/>
      <stop offset="1" stop-color="#F4BE1C"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9E2E4"/>
    </linearGradient>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="8" dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.30"/></feComponentTransfer>
      <feFlood flood-color="#8A2A06"/>
      <feComposite operator="in" in2="SourceAlpha"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- body: edge-to-edge within the macOS squircle -->
  <g filter="url(#body)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#lift)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="6"/>
  </g>

  <!-- subject: the folder, tilted a little as if trotting home -->
  <g transform="rotate(-7 500 540)" filter="url(#drop)">
    <!-- back panel with its tab -->
    <path d="M232 318 a46 46 0 0 1 46 -46 h132 a46 46 0 0 1 36 17 l28 35 h232 a46 46 0 0 1 46 46 v340 H232 z" fill="url(#back)"/>
    <!-- front panel: the character's body -->
    <rect x="206" y="376" width="560" height="398" rx="70" fill="url(#front)"/>
    <!-- broad upper-left highlight on the front -->
    <path d="M262 410 Q380 396 520 400" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.75"/>
    <!-- face: big glossy eyes glancing up-right at the bubble, small open smile -->
    <ellipse cx="332" cy="548" rx="40" ry="50" fill="#121212"/>
    <ellipse cx="466" cy="548" rx="40" ry="50" fill="#121212"/>
    <circle cx="346" cy="530" r="14" fill="#FFFFFF"/>
    <circle cx="480" cy="530" r="14" fill="#FFFFFF"/>
    <path d="M359 636 Q399 676 439 636" stroke="#121212" stroke-width="20" stroke-linecap="round" fill="none"/>
  </g>

  <!-- the hook: its chat bubble, hugged against the folder's side -->
  <g transform="translate(28 40) rotate(8 712 560) scale(0.9) translate(79 62)" filter="url(#drop)">
    <path d="M610 452 h196 a64 64 0 0 1 64 64 v92 a64 64 0 0 1 -64 64 h-104 l-58 46 l10 -46 h-44 a64 64 0 0 1 -64 -64 v-92 a64 64 0 0 1 64 -64 z" fill="url(#bubble)"/>
    <circle cx="646" cy="562" r="22" fill="#F95E2B"/>
    <circle cx="710" cy="562" r="22" fill="#F95E2B"/>
    <circle cx="774" cy="562" r="22" fill="#F95E2B"/>
  </g>
</svg>
