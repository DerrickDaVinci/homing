<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Homing app icon: a project folder that is also a little house.
       Teal body on the macOS 824 px grid, light from the upper left. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22B39B"/>
      <stop offset="1" stop-color="#0B6457"/>
    </linearGradient>
    <radialGradient id="lift" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9F4EF"/>
      <stop offset="1" stop-color="#C9E2D8"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F1EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#043A32" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#lift)"/>
  <g filter="url(#shadow)">
    <path d="M250 330 a40 40 0 0 1 40 -40 h150 a40 40 0 0 1 30 14 l36 42 h228 a40 40 0 0 1 40 40 v34 H250 z" fill="url(#back)"/>
    <path d="M232 452 a36 36 0 0 1 36 -36 h170 L512 360 L586 416 h170 a36 36 0 0 1 36 36 v262 a46 46 0 0 1 -46 46 H278 a46 46 0 0 1 -46 -46 z" fill="url(#front)"/>
    <path d="M466 760 v-112 a46 46 0 0 1 92 0 v112 z" fill="#0E7A6A"/>
    <circle cx="540" cy="708" r="8" fill="#BFE6DC"/>
  </g>
