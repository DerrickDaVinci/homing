<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homing</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { background: transparent !important; overflow: hidden; width: 300px; height: 300px; }
  /* The ring floats over any wallpaper or window, so it carries its own shadow. */
  svg { display: block; width: 300px; height: 300px; overflow: visible; filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .30)) drop-shadow(0 1px 2px rgba(0, 0, 0, .18)); }
  svg.in { animation: pop .17s cubic-bezier(.2, .9, .3, 1.25); }
  @keyframes pop { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: none; } }
  .rs > path { fill: var(--panel); stroke: var(--line-2); stroke-width: 1.2; transition: fill .1s; }
  .rs text { fill: var(--ink); font: 600 12.5px var(--f-ui); text-anchor: middle; pointer-events: none; }
  .rs .ic { stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .rs.hot > path { fill: var(--accent); stroke: var(--accent); }
  .rs.hot text { fill: var(--on-accent); }
  .rs.hot .ic { stroke: var(--on-accent); }
  .rh circle { fill: var(--panel-2); stroke: var(--line-2); }
  .rh.hot circle { fill: var(--panel); stroke: var(--ink-3); }
  .rh text { fill: var(--ink-2); font: 500 11.5px var(--f-ui); text-anchor: middle; }
  .rh .big { fill: var(--ink); font: 700 15px var(--f-ui); }
  .rh .ok { fill: var(--accent); }
  .rh .err { fill: var(--high); }
  .spin { transform-origin: 150px 150px; animation: spin .8s linear infinite; fill: none !important; stroke: var(--accent) !important; stroke-width: 3; stroke-linecap: round; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .count { fill: var(--accent); }
  .count-t { fill: var(--on-accent); font: 700 11px var(--f-ui); text-anchor: middle; }
</style>
</head>
<body>
<svg id="ring" viewBox="0 0 300 300" aria-hidden="true"></svg>
<script src="preview-mock.js"></script>
<script src="theme.js"></script>
<script src="ring.js"></script>
</body>
</html>
